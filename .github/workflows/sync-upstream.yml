name: Sync upstream

on:
  schedule:
    - cron: "17 18 * * *" # 매일 03:17 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge deepbeepmeep/Wan2GP into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main \
            --jq '"\(.merge_type) - \(.message)"'
